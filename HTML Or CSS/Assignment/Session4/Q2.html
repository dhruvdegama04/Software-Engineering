<!-- 2.Recreate a Zomato-style restaurant listing card using semantic HTML5 tags: use <article> 
for each restaurant, <header> for the restaurant name, and <footer> for rating and delivery time. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Style Restaurant Card</title>
</head>
<body>

    <article class="restaurant-card">
        <header>
            <img src="/image/dish.jpeg.jfif" alt="The Italian Bistro dish preview">
            <h2>The Italian Bistro</h2>
            <p>Pastas, Pizzas, Italian</p>
        </header>
        
        <p class="cost-for-two">₹600 for two</p>

        <footer>
            <div class="rating">
                <span>4.3 ★</span>
            </div>
            <div class="delivery-time">
                <span>25-30 mins</span>
            </div>
        </footer>
    </article>

</body>
</html>
