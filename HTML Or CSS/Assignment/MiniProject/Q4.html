<!-- 4.
After submitting the form, show a preview card for each link with the platform logo, the username/handle extracted from the URL, and a 'Visit' button that opens the link in a new tab.<br><br><em><strong>Constraint:</strong> The preview cards must look visually distinct for each platform (different colors or borders).</em> -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Preview Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 12px;
    }
    input[type="url"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button[type="submit"] {
      padding: 10px 16px;
      cursor: pointer;
    }

    /* Container for Preview Cards */
    #preview-container {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Common Card Styling */
    .preview-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 6px solid #ccc; /* Default fallback border */
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background-color: #f9f9f9;
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .platform-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .username {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .visit-btn {
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 4px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: #333;
    }

    /* Platform-Specific Visual Distinctions */
    .preview-card.github {
      border-left-color: #2ea44f;
      background-color: #f6f8fa;
    }
    .preview-card.github .visit-btn { background-color: #24292e; }

    .preview-card.twitter {
      border-left-color: #1da1f2;
      background-color: #f0f8ff;
    }
    .preview-card.twitter .visit-btn { background-color: #1da1f2; }

    .preview-card.linkedin {
      border-left-color: #0a66c2;
      background-color: #f3f6f8;
    }
    .preview-card.linkedin .visit-btn { background-color: #0a66c2; }

    .preview-card.generic {
      border-left-color: #6c757d;
      background-color: #f8f9fa;
    }
    .preview-card.generic .visit-btn { background-color: #6c757d; }
  </style>
</head>
<body>

  <form id="link-form">
    <div class="form-group">
      <input type="url" placeholder="https://github.com/octocat" required />
    </div>
    <div class="form-group">
      <input type="url" placeholder="https://x.com/techuser" />
    </div>
    <button type="submit">Submit Links</button>
  </form>

  <div id="preview-container"></div>

  <script>
    // Config for supported platforms, brand icons, and fallback handling
    const PLATFORMS = {
      github: {
        name: 'github',
        logo: 'https://cdn.simpleicons.org/github/24292e',
        match: (host) => host.includes('github.com')
      },
      twitter: {
        name: 'twitter',
        logo: 'https://cdn.simpleicons.org/x/000000',
        match: (host) => host.includes('twitter.com') || host.includes('x.com')
      },
      linkedin: {
        name: 'linkedin',
        logo: 'https://cdn.simpleicons.org/linkedin/0A66C2',
        match: (host) => host.includes('linkedin.com')
      }
    };

    /**
     * Parses a URL to identify platform type and user handle.
     */
    function parseLink(urlString) {
      try {
        const url = new URL(urlString);
        const host = url.hostname.toLowerCase();
        
        // Match platform configuration
        let platformKey = 'generic';
        for (const key in PLATFORMS) {
          if (PLATFORMS[key].match(host)) {
            platformKey = key;
            break;
          }
        }

        // Extract handle from pathname (skipping empty segments)
        const pathSegments = url.pathname.split('/').filter(Boolean);
        let handle = pathSegments[0] || host;

        // Clean up handle formatting (e.g., handle LinkedIn /in/ or /company/ prefixes)
        if (platformKey === 'linkedin' && pathSegments.length > 1) {
          handle = pathSegments[1];
        }
        
        if (!handle.startsWith('@') && platformKey !== 'generic') {
          handle = `@${handle}`;
        }

        const logo = platformKey !== 'generic' 
          ? PLATFORMS[platformKey].logo 
          : `https://www.google.com/s2/favicons?domain=${host}&sz=64`;

        return {
          url: urlString,
          platform: platformKey,
          handle: handle,
          logo: logo
        };
      } catch (err) {
        return null; // Invalid URL
      }
    }

    // Form submission handler
    document.getElementById('link-form').addEventListener('submit', function (e) {
      e.preventDefault();
      
      const container = document.getElementById('preview-container');
      container.innerHTML = ''; // Clear existing previews

      const inputs = this.querySelectorAll('input[type="url"]');
      
      inputs.forEach(input => {
        const val = input.value.trim();
        if (!val) return;

        const data = parseLink(val);
        if (!data) return;

        // Build HTML template string
        const cardHtml = `
          <div class="preview-card ${data.platform}">
            <div class="card-info">
              <img class="platform-logo" src="${data.logo}" alt="${data.platform} logo" />
              <span class="username">${data.handle}</span>
            </div>
            <a href="${data.url}" class="visit-btn" target="_blank" rel="noopener noreferrer">Visit</a>
          </div>
        `;

        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    });
  </script>
</body>
</html>
