<!-- 1.Create an HTML form called musicLinksForm that accepts Spotify, YouTube Music, 
 and Apple Music profile URLs as input fields, and display the submitted links as styled
  preview cards below the form. -->

  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Links Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Platform Accent Styles */
    .card-spotify { border-left: 5px solid #1DB954; }
    .card-youtube { border-left: 5px solid #FF0000; }
    .card-apple { border-left: 5px solid #FA243C; }
    
    .icon-spotify { color: #1DB954; }
    .icon-youtube { color: #FF0000; }
    .icon-apple { color: #FA243C; }
  </style>
</head>
<body class="bg-light py-5">

  <div class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body p-4">
        <h2 class="h4 card-title mb-3 text-center fw-bold">Music Profiles</h2>
        <p class="text-muted small mb-4 text-center">Enter your streaming platform profile links below.</p>
        
        <form id="musicLinksForm">
          <div class="mb-3">
            <label for="spotifyUrl" class="form-label font-weight-bold">
              <i class="bi bi-spotify icon-spotify me-1"></i> Spotify Profile URL
            </label>
            <input 
              type="url" 
              class="form-control" 
              id="spotifyUrl" 
              placeholder="https://open.spotify.com/user/yourid" 
              required
            >
          </div>

          <div class="mb-3">
            <label for="youtubeUrl" class="form-label">
              <i class="bi bi-youtube icon-youtube me-1"></i> YouTube Music Profile URL
            </label>
            <input 
              type="url" 
              class="form-control" 
              id="youtubeUrl" 
              placeholder="https://music.youtube.com/channel/yourid" 
              required
            >
          </div>

          <div class="mb-4">
            <label for="appleUrl" class="form-label">
              <i class="bi bi-apple icon-apple me-1"></i> Apple Music Profile URL
            </label>
            <input 
              type="url" 
              class="form-control" 
              id="appleUrl" 
              placeholder="https://music.apple.com/profile/yourid" 
              required
            >
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold">Generate Preview Cards</button>
        </form>
      </div>
    </div>

    <div id="cardsDisplayContainer" class="d-none">
      <h3 class="h5 mb-3 text-secondary">Submitted Links</h3>
      <div id="cardsList" class="d-flex flex-column gap-3"></div>
    </div>
  </div>

  <script>
    document.getElementById('musicLinksForm').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent page refresh

      // Capture input values
      const spotifyUrl = document.getElementById('spotifyUrl').value;
      const youtubeUrl = document.getElementById('youtubeUrl').value;
      const appleUrl = document.getElementById('appleUrl').value;

      // Platform Configuration Data
      const platforms = [
        {
          name: 'Spotify',
          url: spotifyUrl,
          cardClass: 'card-spotify',
          iconClass: 'bi-spotify icon-spotify',
          btnClass: 'btn-success'
        },
        {
          name: 'YouTube Music',
          url: youtubeUrl,
          cardClass: 'card-youtube',
          iconClass: 'bi-youtube icon-youtube',
          btnClass: 'btn-danger'
        },
        {
          name: 'Apple Music',
          url: appleUrl,
          cardClass: 'card-apple',
          iconClass: 'bi-apple icon-apple',
          btnClass: 'btn-dark'
        }
      ];

      // Clear previous display cards
      const cardsList = document.getElementById('cardsList');
      cardsList.innerHTML = '';

      // Generate Card HTML for each platform
      platforms.forEach(platform => {
        const cardHTML = `
          <div class="card shadow-sm ${platform.cardClass}">
            <div class="card-body d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center">
                <i class="bi ${platform.iconClass} fs-2 me-3"></i>
                <div>
                  <h5 class="card-title mb-0 h6">${platform.name}</h5>
                  <p class="card-text text-muted small text-truncate mb-0" style="max-width: 250px;">
                    ${platform.url}
                  </p>
                </div>
              </div>
              <a href="${platform.url}" target="_blank" class="btn btn-sm ${platform.btnClass}">
                Visit Profile
              </a>
            </div>
          </div>
        `;
        cardsList.insertAdjacentHTML('beforeend', cardHTML);
      });

      // Make the output section visible
      document.getElementById('cardsDisplayContainer').classList.remove('d-none');
    });
  </script>

</body>
</html>
