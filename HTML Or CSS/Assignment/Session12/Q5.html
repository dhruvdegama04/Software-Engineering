<!-- 5.Add a footer to your page with Instagram-style social icons and ensure 
the entire layout remains visually cohesive by applying a consistent color scheme 
using Bootstrap utility classes. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cohesive Footer Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

  <main class="container my-5 text-center">
    <h1>Main Content</h1>
    <p class="text-muted">Your page content goes here.</p>
  </main>

  <footer class="bg-dark text-light pt-5 pb-4 mt-auto border-top border-secondary">
    <div class="container">
      <div class="row gy-4">
        
        <div class="col-lg-4 col-md-6">
          <h5 class="text-uppercase fw-bold text-warning mb-3">Your Brand</h5>
          <p class="small text-secondary">
            Creating modern, cohesive web experiences with clean design and functional layouts.
          </p>
        </div>

        <div class="col-lg-2 col-md-6">
          <h6 class="text-uppercase fw-bold text-light mb-3">Links</h6>
          <ul class="list-unstyled mb-0">
            <li><a href="#" class="text-secondary text-decoration-none hover-light">Home</a></li>
            <li><a href="#" class="text-secondary text-decoration-none hover-light">About</a></li>
            <li><a href="#" class="text-secondary text-decoration-none hover-light">Services</a></li>
            <li><a href="#" class="text-secondary text-decoration-none hover-light">Contact</a></li>
          </ul>
        </div>

        <div class="col-lg-6 col-md-12 text-lg-end">
          <h6 class="text-uppercase fw-bold text-light mb-3">Connect With Us</h6>
          <div class="d-flex justify-content-lg-end gap-3 fs-4">
            <a href="#" class="text-light text-decoration-none" aria-label="Instagram">
              <i class="bi bi-instagram"></i>
            </a>
            <a href="#" class="text-light text-decoration-none" aria-label="Facebook">
              <i class="bi bi-facebook"></i>
            </a>
            <a href="#" class="text-light text-decoration-none" aria-label="Twitter">
              <i class="bi bi-twitter-x"></i>
            </a>
            <a href="#" class="text-light text-decoration-none" aria-label="LinkedIn">
              <i class="bi bi-linkedin"></i>
            </a>
          </div>
        </div>

      </div>

      <hr class="my-4 border-secondary">

      <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start">
          <p class="small text-secondary mb-0">&copy; 2026 Your Brand. All rights reserved.</p>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <a href="#" class="small text-secondary text-decoration-none me-3">Privacy Policy</a>
          <a href="#" class="small text-secondary text-decoration-none">Terms of Service</a>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
