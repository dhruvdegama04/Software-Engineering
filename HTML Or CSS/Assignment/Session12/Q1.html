<!-- 1.Create a static landing page for a music artist using HTML and CSS, 
featuring their profile image, a short bio, and three social media buttons 
styled with Bootstrap icons. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Landing Page</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #2d124d 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .artist-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 480px;
      width: 100%;
    }

    .profile-img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border: 4px solid #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    .btn-social {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.3s ease;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-spotify { background-color: #1ed760; border-color: #1ed760; }
    .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border: none; }
    .btn-youtube { background-color: #ff0000; border-color: #ff0000; }

    .btn-social:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container text-center">
    <div class="artist-card mx-auto">
      
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=400&q=80" 
           alt="Artist Profile" 
           class="profile-img rounded-circle mb-4">
      
      <h1 class="fw-bold mb-1">Aria Vance</h1>
      <p class="text-uppercase tracking-wider text-warning small fw-semibold mb-3">Indie Pop / Electronic</p>
      
      <p class="text-light opacity-75 fs-6 mb-4">
        Creating immersive soundscapes blending soulful melodies with modern electronic beats. New album <em class="text-white fw-bold">"Echoes in the Dark"</em> out now on all streaming platforms.
      </p>
      
      <div class="d-flex justify-content-center gap-3">
        <a href="#" class="btn btn-social btn-spotify" aria-label="Spotify">
          <i class="bi bi-spotify"></i>
        </a>
        <a href="#" class="btn btn-social btn-instagram" aria-label="Instagram">
          <i class="bi bi-instagram"></i>
        </a>
        <a href="#" class="btn btn-social btn-youtube" aria-label="YouTube">
          <i class="bi bi-youtube"></i>
        </a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
