Responsive Product Card Notes
Mobile View (e.g., < 576px):

The layout stacks vertically into a single column.

Product images scale down to fit the narrow screen width while maintaining their aspect ratio.

Buttons and interactive targets span full width for easy tapping.

Padding and font sizes are reduced slightly to optimize screen real estate.

Tablet View (e.g., 768px - 992px):

The product card adjusts to a side-by-side split layout (or fits 2–3 cards per row if in a grid).

Padding around text increases for better readability.

Font sizes scale up slightly to match the larger canvas.

Desktop View (e.g., > 1200px):

Cards display in a full multi-column grid layout with fixed maximum widths to prevent stretching.

Hover effects (like shadow drop, image zoom, or border highlights) become active for mouse interactions.

All call-to-action buttons align neatly across card rows. -->
