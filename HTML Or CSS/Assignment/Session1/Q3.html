<!-- 3.Use Chrome DevTools to change the background color of your name (in myprofile.html)
to any color you like, live in the browser, without editing the HTML file. 

1.Inspect the Element:
    
    F12 or Ctrl+Shift+I (Cmd+Option+I on Mac).
    
    Open myprofile.html in Chrome, right-click exactly on your name on the webpage, and select Inspect. 
    This opens the DevTools panel with your name's HTML element automatically highlighted in the Elements tab.
    
2.Locate the Styles Pane:

    Look at the panel next to (or below) the HTML code. 
    Make sure you are on the Styles tab.
    
3.Add the CSS Rule:

    At the very top of the Styles tab, you will see a block labeled element.style { }. 
    Click anywhere inside that empty space between the brackets.
    
4.Apply the Color:

    Type background-color and press Tab or Enter. 
    Then, type a color of your choice (e.g., yellow, lightblue, or a hex code like #ff9900) and press Enter.-->
