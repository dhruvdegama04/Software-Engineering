#Structural Breakdown

Level 1 (Root): <html> acts as the primary parent container for the entire document.

Level 2 (Document Branches): <head> contains configuration and CSS links, while <body> serves as the parent for all visible elements.

Level 3 (Semantic Landmarks): The <body> branches into <header> (introductory content), 
        <main> (core profile content), and <footer> (closing details).

Level 4 (Content Containers): Inside <main>, individual <section> elements group related topics together, 
        creating logical divisions for layout and styling.

Level 5+ (Leaf Nodes): The deepest elements—like <h2>, <p>, <li>, and <input>—hold the actual text, links, 
        and interactive form fields that users see and click. -->
