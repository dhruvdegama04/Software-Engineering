<!-- 4.Refactor your 2-column layout to be mobile-friendly: make the columns 
 stack vertically on screens smaller than 576px using Bootstrap's responsive 
 grid classes.<br><br><em><strong>Hint:</strong> Try using col-12 for xs and col-6 
for md and above.</em> -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive 2-Column Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-5">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <div class="p-4 bg-primary text-white rounded">
          <h2>Column 1</h2>
          <p>This column takes up 100% width on extra-small screens (&lt;576px) and 50% width on medium screens and up.</p>
        </div>
      </div>
      
      <div class="col-12 col-md-6">
        <div class="p-4 bg-secondary text-white rounded">
          <h2>Column 2</h2>
          <p>This column stacks underneath Column 1 on small mobile screens and sits next to it on larger screens.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
