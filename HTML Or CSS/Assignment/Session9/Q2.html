<!-- 2.Build a Zomato restaurant listing page using Bootstrap grid: arrange two 
 restaurant cards per row, each card showing a restaurant name and a short description.
 <br><br><em><strong>Hint:</strong> Use col-6 inside a row to get two equal columns per 
 row.</em> -->

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zomato Style Restaurant Listing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f8f8;
      font-family: 'Okra', sans-serif, Helvetica, Arial;
    }
    .restaurant-card {
      border-radius: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .restaurant-card:hover {
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1) !important;
      transform: translateY(-3px);
    }
    .card-img-top {
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
    }
    .rating-badge {
      background-color: #24963f;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="row g-4">
      
      <div class="col-6">
        <div class="card h-100 border-0 shadow-sm restaurant-card">
          <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Italian Restaurant">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h5 class="card-title mb-0 fw-bold text-truncate">La Bella Italia</h5>
              <span class="rating-badge">4.5 <i class="bi bi-star-fill small"></i></span>
            </div>
            <p class="card-text text-muted small mb-0 text-truncate">
              Authentic wood-fired pizzas, handcrafted pastas, and classic Italian desserts.
            </p>
          </div>
        </div>
      </div>

      <div class="col-6">
        <div class="card h-100 border-0 shadow-sm restaurant-card">
          <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Asian Fusion Restaurant">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h5 class="card-title mb-0 fw-bold text-truncate">The Spice Route</h5>
              <span class="rating-badge">4.3 <i class="bi bi-star-fill small"></i></span>
            </div>
            <p class="card-text text-muted small mb-0 text-truncate">
              Pan-Asian delicacies featuring fresh sushi, dim sums, and fragrant Thai curries.
            </p>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
