<!--5.Create a table that compares 3 food delivery apps (e.g., Zomato, Swiggy, Uber Eats) 
with columns for App Name, Delivery Charges, and Rating. Fill in sample data for each.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery Apps Comparison</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        .table-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #4CAF50;
            color: white;
            padding: 12px 16px;
            font-size: 16px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #ddd;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e9f5e9;
        }

        .note {
            font-size: 12px;
            color: #666;
            padding: 10px 16px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>App Name</th>
                    <th>Delivery Charges</th>
                    <th>Rating</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Zomato</strong></td>
                    <td>₹20 – ₹60 (Free with Gold)</td>
                    <td>4.4 / 5</td>
                </tr>
                <tr>
                    <td><strong>Swiggy</strong></td>
                    <td>₹25 – ₹65 (Free with One)</td>
                    <td>4.3 / 5</td>
                </tr>
                <tr>
                    <td><strong>Uber Eats</strong></td>
                    <td>$1.99 – $5.99 (Free with Uber One)</td>
                    <td>4.2 / 5</td>
                </tr>
            </tbody>
        </table>
        <div class="note">
            * Note: Delivery charges and ratings are sample estimates and vary by distance and time.
        </div>
    </div>

</body>
</html>
