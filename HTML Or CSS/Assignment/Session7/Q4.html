<!-- 4.Make your product grid responsive: use grid-template-columns to show 3 
columns on desktop, 2 columns on tablet, and 1 column on mobile screens.
<br><br><em><strong>Hint:</strong> Use CSS media queries to change 
grid-template-columns based on screen width.</em> -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Grid</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f4f4f9;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr; /* Mobile default: 1 column */
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    @media (min-width: 600px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <h1>Our Products</h1>

  <div class="product-grid">
    <div class="product-card">
      <h3>Product 1</h3>
      <p>$19.99</p>
    </div>
    <div class="product-card">
      <h3>Product 2</h3>
      <p>$29.99</p>
    </div>
    <div class="product-card">
      <h3>Product 3</h3>
      <p>$39.99</p>
    </div>
    <div class="product-card">
      <h3>Product 4</h3>
      <p>$49.99</p>
    </div>
    <div class="product-card">
      <h3>Product 5</h3>
      <p>$59.99</p>
    </div>
    <div class="product-card">
      <h3>Product 6</h3>
      <p>$69.99</p>
    </div>
  </div>

</body>
</html>
