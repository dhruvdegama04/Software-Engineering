<!-- 1.Create an HTML file with a container div and 4 images of your favorite apps 
(Instagram, WhatsApp, Zomato, Spotify) as social icons. Use CSS Flexbox to display them in a
row with equal spacing using justify-content. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Icons Row</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    .social-container {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .social-icon {
      width: 50px;
      height: 50px;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="social-container">
    <a href="https://www.instagram.com" target="_blank" rel="noopener">
      <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram" class="social-icon">
    </a>
    <a href="https://www.whatsapp.com" target="_blank" rel="noopener">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp" class="social-icon">
    </a>
    <a href="https://www.zomato.com" target="_blank" rel="noopener">
      <img src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png" alt="Zomato" class="social-icon">
    </a>
    <a href="https://www.spotify.com" target="_blank" rel="noopener">
      <img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify" class="social-icon">
    </a>
  </div>

</body>
</html>
