<!-- 1.reate an HTML file for a Flipkart-style product card and apply inline CSS to set a unique background 
color and font size for the product title only. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Card</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f1f3f6; display: flex; justify-content: center; padding: 40px; margin: 0;">

    <div style="background-color: #ffffff; width: 280px; padding: 16px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; position: relative;">
        
        <img src="https://via.placeholder.com/200" alt="Wireless Headphones" style="width: 100%; height: auto; border-radius: 4px; margin-bottom: 12px;">

        <h2 style="font-size: 20px; background-color: #e8f0fe; color: #212121; margin: 0 0 8px 0; padding: 6px 10px; border-radius: 4px; display: inline-block;">
            Wireless Noise Cancelling Headphones
        </h2>

        <div style="margin-bottom: 8px;">
            <span style="background-color: #388e3c; color: #ffffff; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 3px;">
                4.5 &#9733;
            </span>
            <span style="color: #878787; font-size: 13px; margin-left: 6px;">
                (2,450)
            </span>
        </div>

        <div style="margin-bottom: 12px;">
            <span style="font-size: 18px; font-weight: bold; color: #212121;">
                &#8377;2,999
            </span>
            <span style="font-size: 14px; color: #878787; text-decoration: line-through; margin-left: 8px;">
                &#8377;5,999
            </span>
            <span style="font-size: 14px; color: #388e3c; font-weight: bold; margin-left: 8px;">
                50% off
            </span>
        </div>

        <button style="background-color: #ff9f00; color: #ffffff; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 2px; cursor: pointer; width: 100%;">
            ADD TO CART
        </button>
    </div>

</body>
</html>
