<!-- 1.Create an HTML form for a Flipkart-style product review, including input fields for username, 
rating (as a dropdown from 1 to 5), and a textarea for the review message. Use appropriate labels for
each field. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
</head>
<body>

    <h2>Write a Product Review</h2>

    <form action="/submit-review" method="POST">
        <div>
            <label for="username">User Name:</label><br>
            <input type="text" id="username" name="username" placeholder="Enter your name" required>
        </div>
        <br>

        <div>
            <label for="rating">Rating:</label><br>
            <select id="rating" name="rating" required>
                <option value="" disabled selected>Select rating</option>
                <option value="1">1 -> Very Poor</option>
                <option value="2">2 -> Poor</option>
                <option value="3">3 -> Average</option>
                <option value="4">4 -> Good</option>
                <option value="5">5 -> Excellent</option>
            </select>
        </div>
        <br>

        <div>
            <label for="review">Review Description:</label><br>
            <textarea id="review" name="review" rows="5" cols="40" placeholder="Write your review here..." required></textarea>
        </div>
        <br>

        <button type="submit">Submit Review</button>
    </form>

</body>
</html>
