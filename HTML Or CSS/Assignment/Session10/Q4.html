<!-- 4.Create a Bootstrap Form for a Zomato-style restaurant review: 
 include fields for name, rating (1-5 stars), and a review message, 
 along with a submit button. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave a Review | Zomato Style</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Zomato-style interactive star rating styling */
    .star-rating {
      display: inline-flex;
      flex-direction: row-reverse;
      gap: 0.25rem;
    }
    .star-rating input {
      display: none;
    }
    .star-rating label {
      font-size: 1.75rem;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input:checked ~ label {
      color: #e23744; /* Zomato Red */
    }
  </style>
</head>
<body class="bg-light p-3 p-md-5">

  <div class="container" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      
      <!-- Header -->
      <div class="bg-white border-bottom p-4">
        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="bi bi-star-fill text-danger fs-4"></i>
          <h4 class="fw-bold mb-0">Write a Review</h4>
        </div>
        <p class="text-muted small mb-0">Share your dining experience to help other foodies!</p>
      </div>

      <!-- Form Body -->
      <div class="card-body p-4 bg-white">
        <form>
          
          <!-- Name Field -->
          <div class="mb-3">
            <label for="reviewerName" class="form-label fw-semibold">Your Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control bg-light border-start-0" id="reviewerName" placeholder="e.g. Rahul Sharma" required>
            </div>
          </div>

          <!-- Star Rating (1-5 Stars) -->
          <div class="mb-3">
            <label class="form-label fw-semibold d-block">Overall Rating</label>
            <div class="star-rating">
              <input type="radio" id="star5" name="rating" value="5" required />
              <label for="star5" title="5 stars"><i class="bi bi-star-fill"></i></label>
              
              <input type="radio" id="star4" name="rating" value="4" />
              <label for="star4" title="4 stars"><i class="bi bi-star-fill"></i></label>
              
              <input type="radio" id="star3" name="rating" value="3" />
              <label for="star3" title="3 stars"><i class="bi bi-star-fill"></i></label>
              
              <input type="radio" id="star2" name="rating" value="2" />
              <label for="star2" title="2 stars"><i class="bi bi-star-fill"></i></label>
              
              <input type="radio" id="star1" name="rating" value="1" />
              <label for="star1" title="1 star"><i class="bi bi-star-fill"></i></label>
            </div>
          </div>

          <!-- Review Message -->
          <div class="mb-4">
            <label for="reviewMessage" class="form-label fw-semibold">Your Review</label>
            <textarea class="form-control bg-light" id="reviewMessage" rows="4" placeholder="How was the food, ambiance, and service?" required></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-danger w-100 py-2.5 fw-bold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2" style="background-color: #e23744; border: none;">
            <i class="bi bi-send-fill"></i> Submit Review
          </button>

        </form>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
