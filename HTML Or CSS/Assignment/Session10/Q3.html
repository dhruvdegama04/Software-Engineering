<!-- 3.Build a Bootstrap Carousel that cycles through 3 movie posters, 
 each with a caption below like BookMyShow's featured movies section.
 <br><br><em><strong>Hint:</strong> Use Bootstrap's Carousel component 
    and add images with captions inside each carousel-item.</em> -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookMyShow Style Movie Carousel</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Gradient overlay to make text readable over posters */
    .carousel-caption-overlay {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 60%, transparent 100%);
    }
  </style>
</head>
<body class="bg-dark text-white">

  <div class="container my-5" style="max-width: 900px;">
    <h3 class="fw-bold mb-3">Recommended Movies</h3>

    <!-- Movie Carousel -->
    <div id="movieCarousel" class="carousel slide rounded-4 overflow-hidden shadow-lg" data-bs-ride="carousel" data-bs-interval="4000">
      
      <!-- Slide Indicators -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <!-- Carousel Inner Items -->
      <div class="carousel-inner">
        
        <!-- Slide 1 -->
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80" class="d-block w-100 object-fit-cover" style="height: 420px;" alt="Sci-Fi Movie Poster">
          <div class="carousel-caption carousel-caption-overlay start-0 end-0 bottom-0 p-4 text-start">
            <span class="badge bg-danger mb-2">NOW SHOWING</span>
            <h2 class="fw-bold fs-3 mb-1">Interstellar Horizon</h2>
            <p class="text-light-50 small mb-2"><i class="bi bi-star-fill text-warning"></i> 8.9/10 (120K Votes) &bull; Sci-Fi/Adventure &bull; 2h 45m</p>
            <a href="#" class="btn btn-danger btn-sm rounded-pill px-4 fw-semibold">Book Tickets</a>
          </div>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80" class="d-block w-100 object-fit-cover" style="height: 420px;" alt="Action Movie Poster">
          <div class="carousel-caption carousel-caption-overlay start-0 end-0 bottom-0 p-4 text-start">
            <span class="badge bg-warning text-dark mb-2">TRENDING</span>
            <h2 class="fw-bold fs-3 mb-1">Shadows of the City</h2>
            <p class="text-light-50 small mb-2"><i class="bi bi-star-fill text-warning"></i> 8.4/10 (85K Votes) &bull; Action/Thriller &bull; 2h 15m</p>
            <a href="#" class="btn btn-danger btn-sm rounded-pill px-4 fw-semibold">Book Tickets</a>
          </div>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1200&q=80" class="d-block w-100 object-fit-cover" style="height: 420px;" alt="Fantasy Movie Poster">
          <div class="carousel-caption carousel-caption-overlay start-0 end-0 bottom-0 p-4 text-start">
            <span class="badge bg-success mb-2">NEW RELEASE</span>
            <h2 class="fw-bold fs-3 mb-1">Kingdom of Legends</h2>
            <p class="text-light-50 small mb-2"><i class="bi bi-star-fill text-warning"></i> 9.1/10 (200K Votes) &bull; Fantasy/Drama &bull; 3h 00m</p>
            <a href="#" class="btn btn-danger btn-sm rounded-pill px-4 fw-semibold">Book Tickets</a>
          </div>
        </div>

      </div>

      <!-- Controls (Previous / Next) -->
      <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>

    </div>
  </div>

  <!-- Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
