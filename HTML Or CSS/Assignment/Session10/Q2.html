<!-- 2.Design a Bootstrap Card to display a Flipkart-style product preview with an 
 image, product name, price, and a 'Buy Now' button. -->

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Product Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container d-flex justify-content-center">
    <div class="card h-100 shadow-sm border-0 position-relative" style="width: 18rem;">
      
      <button class="btn btn-light rounded-circle position-absolute top-0 end-0 m-2 p-1 shadow-sm border-0" aria-label="Add to wishlist">
        <i class="bi bi-heart text-muted fs-6"></i>
      </button>

      <div class="p-3 text-center bg-white rounded-top">
        <img 
          src="/image/headphone.jpeg" 
          class="card-img-top img-fluid object-fit-contain" 
          alt="Wireless Headphones"
          style="height: 180px;"
        >
      </div>

      <div class="card-body d-flex flex-column justify-content-between pt-1">
        <div>
          <small class="text-muted fw-semibold text-uppercase">Audio</small>
          
          <h5 class="card-title text-truncate fs-6 fw-bold mb-1" title="Premium Wireless Noise Canceling Headphones">
            Premium Wireless Headphones
          </h5>

          <div class="mb-2 d-flex align-items-center gap-2">
            <span class="badge bg-success d-inline-flex align-items-center gap-1">
              4.3 <i class="bi bi-star-fill text-white" style="font-size: 0.75rem;"></i>
            </span>
            <small class="text-muted fs-7">(1,240)</small>
          </div>

          <div class="d-flex align-items-baseline gap-2 mb-3">
            <span class="fs-5 fw-bold text-dark">₹1,999</span>
            <span class="text-decoration-line-through text-muted small">₹3,999</span>
            <span class="text-success fw-bold small">50% off</span>
          </div>
        </div>

        <button class="btn btn-warning w-100 fw-bold text-dark d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-lightning-fill"></i> Buy Now
        </button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
