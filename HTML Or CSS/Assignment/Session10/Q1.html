<!-- 1.Create a Bootstrap Navbar for a music playlist app like Spotify, 
 including links for Home, Playlists, and Profile. Make sure it collapses into a
 hamburger menu on mobile. -->

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Style Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

  <nav class="navbar navbar-expand-lg navbar-dark bg-black px-3">
    <div class="container-fluid">
      
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-success" href="#">
        <i class="bi bi-spotify fs-3"></i>
        <span>MusicApp</span>
      </a>

      <button 
        class="navbar-toggler border-0" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#spotifyNavbar" 
        aria-controls="spotifyNavbar" 
        aria-expanded="false" 
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="spotifyNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">
              <i class="bi bi-house-door-fill me-1"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-music-note-list me-1"></i> Playlists
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center pt-2 pt-lg-0">
          <a href="#" class="btn btn-outline-light rounded-pill d-flex align-items-center gap-2 px-3">
            <i class="bi bi-person-circle"></i>
            <span>Profile</span>
          </a>
        </div>
      </div>

    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
