<!-- 5.Use Bootstrap Buttons to create a row of filter buttons 
 (e.g., 'All', 'Veg', 'Non-Veg', 'Desserts') for a food delivery app homepage. 
 Highlight the selected filter using the 'active' class. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Category Filters</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container my-4">
    <h5 class="fw-bold mb-3 text-dark">What's on your mind?</h5>

    <!-- Scrollable container for mobile responsiveness -->
    <div class="d-flex flex-nowrap overflow-auto gap-2 pb-2" style="scrollbar-width: thin;">
      
      <!-- 'All' Filter (Active by default) -->
      <button type="button" class="btn btn-outline-danger rounded-pill fw-semibold active d-flex align-items-center gap-1 text-nowrap">
        <i class="bi bi-grid-fill"></i> All
      </button>

      <!-- 'Veg' Filter -->
      <button type="button" class="btn btn-outline-success rounded-pill fw-semibold d-flex align-items-center gap-1 text-nowrap">
        <i class="bi bi-record-circle-fill text-success"></i> Pure Veg
      </button>

      <!-- 'Non-Veg' Filter -->
      <button type="button" class="btn btn-outline-danger rounded-pill fw-semibold d-flex align-items-center gap-1 text-nowrap">
        <i class="bi bi-caret-up-square-fill text-danger"></i> Non-Veg
      </button>

      <!-- 'Desserts' Filter -->
      <button type="button" class="btn btn-outline-warning text-dark rounded-pill fw-semibold d-flex align-items-center gap-1 text-nowrap">
        <i class="bi bi-cup-hot-fill"></i> Desserts
      </button>

      <!-- 'Fast Food' Filter -->
      <button type="button" class="btn btn-outline-secondary rounded-pill fw-semibold d-flex align-items-center gap-1 text-nowrap">
        <i class="bi bi-lightning-charge-fill"></i> Fast Food
      </button>

    </div>
  </div>

  <!-- Optional JavaScript to toggle the 'active' state on click -->
  <script>
    const filterButtons = document.querySelectorAll('.container .btn');
    
    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
      });
    });
  </script>

  <!-- Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
